<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GroupTalked</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #0f172a;
      --border: #334155;
      --border-focus: #6366f1;
      --text-bright: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --bubble-self: #4338ca;
      --bubble-other: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-main); color: var(--text-bright); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; overflow: hidden; }

    .app {
      width: 100%; max-width: 800px; height: 90vh;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); position: relative;
    }

    .header {
      padding: 1rem 1.25rem; background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--border); display: flex;
      justify-content: space-between; align-items: center;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand h1 { font-size: 1.1rem; font-weight: 700; }
    .group-pill {
      font-size: 0.85rem; background: rgba(99, 102, 241, 0.15); color: #818cf8;
      padding: 0.2rem 0.6rem; border-radius: 6px; font-family: monospace;
      border: 1px solid rgba(99, 102, 241, 0.3); font-weight: 600;
    }

    .status {
      display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.8rem;
      padding: 0.25rem 0.65rem; border-radius: 999px; background: rgba(239, 68, 68, 0.1);
      color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); transition: all 0.3s;
    }
    .status.online { background: rgba(34, 197, 94, 0.1); color: #4ade80; border-color: rgba(34, 197, 94, 0.2); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .controls {
      padding: 0.75rem 1.25rem; background: rgba(15, 23, 42, 0.3);
      border-bottom: 1px solid var(--border); display: flex; gap: 1rem;
      align-items: center; flex-wrap: wrap; justify-content: space-between;
    }

    .field { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-muted); }
    
    input {
      background: var(--bg-input); border: 1px solid var(--border);
      color: var(--text-bright); padding: 0.4rem 0.75rem; border-radius: 8px;
      font-size: 0.875rem; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--border-focus); }

    .btn {
      background: var(--accent); color: white; border: none; padding: 0.45rem 0.9rem;
      border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-secondary:hover { background: #475569; }

    .modal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 10; padding: 2rem; text-align: center;
    }
    .modal-card {
      background: var(--bg-card); border: 1px solid var(--border);
      padding: 2rem; border-radius: 16px; max-width: 400px; width: 100%;
      display: flex; flex-direction: column; gap: 1.25rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-card h2 { font-size: 1.3rem; }
    .modal-card p { font-size: 0.875rem; color: var(--text-muted); line-height: 1.4; }
    .modal-actions { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; }

    .chat-body {
      flex: 1; padding: 1.25rem; overflow-y: auto; display: flex;
      flex-direction: column; gap: 0.85rem; background: var(--bg-main);
    }

    .msg { display: flex; flex-direction: column; max-width: 70%; }
    .msg.me { align-self: flex-end; }
    .msg.them { align-self: flex-start; }

    .msg-info {
      font-size: 0.7rem; color: var(--text-muted); margin-bottom: 0.25rem;
      display: flex; gap: 0.4rem;
    }
    .msg.me .msg-info { justify-content: flex-end; }

    .bubble {
      padding: 0.65rem 0.95rem; border-radius: 12px; font-size: 0.9rem;
      line-height: 1.45; word-break: break-word;
    }
    .msg.me .bubble { background: var(--bubble-self); color: #fff; border-bottom-right-radius: 2px; }
    .msg.them .bubble { background: var(--bubble-other); color: var(--text-bright); border-bottom-left-radius: 2px; }

    .sys-msg {
      align-self: center; font-size: 0.75rem; color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03); padding: 0.3rem 0.8rem;
      border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.05); margin: 0.25rem 0;
    }

    .footer {
      padding: 1rem 1.25rem; background: rgba(15, 23, 42, 0.5);
      border-top: 1px solid var(--border); display: flex; gap: 0.75rem;
    }
    .footer input { flex: 1; padding: 0.65rem 1rem; }
    .footer input:disabled, .footer button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="app">
    <div id="joinModal" class="modal-overlay">
      <div class="modal-card">
        <h2>You are not in a group</h2>
        <p>Join an existing group number or create a new group number to start chatting.</p>
        
        <div class="field" style="flex-direction: column; align-items: stretch;">
          <input type="number" id="modalGroupInput" placeholder="Enter Group Number (e.g. 505)" min="1">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn" id="modalJoinBtn">Join Group</button>
          <button type="button" class="btn btn-secondary" id="modalCreateBtn">Create New Group</button>
        </div>
      </div>
    </div>

    <div class="header">
      <div class="brand">
        <h1>GroupTalked</h1>
        <span id="groupTag" class="group-pill">No Group</span>
      </div>
      <div id="status" class="status">
        <span class="status-dot"></span>
        <span id="statusTxt">Connecting...</span>
      </div>
    </div>

    <div class="controls">
      <div class="field">
        <label>Name:</label>
        <input type="text" id="nameInput" maxlength="15" placeholder="Nickname" style="width: 120px;">
      </div>

      <div class="field">
        <label>Group #:</label>
        <input type="number" id="groupInput" placeholder="e.g. 100" style="width: 90px;" min="1">
        <button type="button" class="btn" id="joinBtn">Join</button>
        <button type="button" class="btn btn-secondary" id="createBtn">Create New</button>
      </div>
    </div>

    <div id="chatBody" class="chat-body"></div>

    <form id="chatForm" class="footer">
      <input type="text" id="msgInput" placeholder="Join a group to type..." autocomplete="off" disabled required>
      <button type="submit" id="sendBtn" class="btn" disabled>Send</button>
    </form>
  </div>

  <script>
    const userId = 'usr_' + Math.random().toString(36).substring(2, 8);
    let currentTopic = '';

    const nameInput = document.getElementById('nameInput');
    const groupInput = document.getElementById('groupInput');
    const modalGroupInput = document.getElementById('modalGroupInput');
    const groupTag = document.getElementById('groupTag');
    const joinBtn = document.getElementById('joinBtn');
    const createBtn = document.getElementById('createBtn');
    const modalJoinBtn = document.getElementById('modalJoinBtn');
    const modalCreateBtn = document.getElementById('modalCreateBtn');
    const joinModal = document.getElementById('joinModal');
    const statusEl = document.getElementById('status');
    const statusTxt = document.getElementById('statusTxt');
    const chatBody = document.getElementById('chatBody');
    const chatForm = document.getElementById('chatForm');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');

    nameInput.value = localStorage.getItem('chat_name') || 'User_' + Math.floor(100 + Math.random() * 900);
    nameInput.addEventListener('change', () => localStorage.setItem('chat_name', nameInput.value.trim()));

    // Connected via EMQX broker over Secure WebSockets (wss://) for GitHub Pages compatibility
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId: 'chat_' + userId,
      keepalive: 60,
      clean: true,
      reconnectPeriod: 3000
    });

    client.on('connect', () => {
      statusEl.classList.add('online');
      statusTxt.textContent = 'Connected';

      const urlGroup = window.location.hash.replace('#', '').replace(/\D/g, '');
      if (urlGroup) {
        joinGroup(urlGroup);
      }
    });

    client.on('offline', () => {
      statusEl.classList.remove('online');
      statusTxt.textContent = 'Reconnecting...';
    });

    function createGroupNumber() {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    function joinGroup(groupNum) {
      const cleanNum = groupNum.toString().replace(/\D/g, '');
      if (!cleanNum) return;

      const targetTopic = `chat_num_group_${cleanNum}`;

      if (currentTopic) client.unsubscribe(currentTopic);

      currentTopic = targetTopic;
      groupTag.textContent = `Group #${cleanNum}`;
      groupInput.value = cleanNum;
      window.location.hash = cleanNum;

      joinModal.style.display = 'none';
      msgInput.disabled = false;
      sendBtn.disabled = false;
      msgInput.placeholder = 'Type a message...';

      chatBody.innerHTML = '';

      client.subscribe(currentTopic, (err) => {
        if (!err) {
          renderSysMsg(`Connected to Group #${cleanNum}. Share this group number with anyone to chat!`);
        }
      });
    }

    joinBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (groupInput.value.trim()) joinGroup(groupInput.value);
    });

    createBtn.addEventListener('click', (e) => {
      e.preventDefault();
      joinGroup(createGroupNumber());
    });

    modalJoinBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (modalGroupInput.value.trim()) joinGroup(modalGroupInput.value);
    });

    modalCreateBtn.addEventListener('click', (e) => {
      e.preventDefault();
      joinGroup(createGroupNumber());
    });

    function triggerBirthdayConfetti() {
      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) {
          return clearInterval(interval);
        }
        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }

    client.on('message', (topic, payload) => {
      try {
        const data = JSON.parse(payload.toString());
        renderMessage(data);
        
        if (data.text.toLowerCase().includes('happy birthday')) {
          triggerBirthdayConfetti();
        }
      } catch (e) {
        console.error('Payload parse error', e);
      }
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      let text = msgInput.value.trim();
      if (!text || !currentTopic) return;

      text = text.replace(/\bhb\b/gi, 'Happy Birthday 🥳🎉');

      const payload = {
        id: userId,
        sender: nameInput.value.trim() || 'Anonymous',
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      client.publish(currentTopic, JSON.stringify(payload));
      msgInput.value = '';
    });

    function renderMessage(data) {
      const isMe = data.id === userId;
      const wrap = document.createElement('div');
      wrap.className = `msg ${isMe ? 'me' : 'them'}`;

      wrap.innerHTML = `
        <div class="msg-info">
          <span>${escapeHtml(data.sender)}</span>
          <span>${data.time}</span>
        </div>
        <div class="bubble">${escapeHtml(data.text)}</div>
      `;

      chatBody.appendChild(wrap);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function renderSysMsg(text) {
      const sys = document.createElement('div');
      sys.className = 'sys-msg';
      sys.textContent = text;
      chatBody.appendChild(sys);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }
  </script>
</body>
</html>
